name: Windows checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out complete test history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            vk_discord_publisher/requirements.lock
            vk_discord_publisher/requirements-ui.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install -r vk_discord_publisher/requirements.lock -r vk_discord_publisher/requirements-ui.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          exit $LASTEXITCODE
      - name: Test Windows behavior and both update packages
        run: python ci/check.py --native-windows
